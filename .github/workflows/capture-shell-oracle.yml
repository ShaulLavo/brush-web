name: Capture shell oracle
on:
  push:
    branches: [climb-scoreboard]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - name: Prepare sandbox and pinned GNU bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          directory="$RUNNER_TEMP/brush-web-oracle-bash"
          mkdir -p "$directory"
          curl --fail --retry 3 https://ftp.gnu.org/gnu/bash/bash-5.3.tar.gz -o "$directory/bash.tar.gz"
          tar -xzf "$directory/bash.tar.gz" -C "$directory"
          cd "$directory/bash-5.3"
          for n in $(seq -w 1 15); do
            curl --fail --retry 3 "https://ftp.gnu.org/gnu/bash/bash-5.3-patches/bash53-0$n" -o "$directory/patch-$n"
            patch -p0 < "$directory/patch-$n"
          done
          ./configure --without-bash-malloc
          make -j2
          sudo install -m755 bash /usr/bin/bash
          /usr/bin/bash --version
      - name: Fetch the pinned Bashkit test source
        run: |
          node --input-type=module <<'JS'
          import {readFile, mkdir, writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const pins = JSON.parse(await readFile('sources.lock.json', 'utf8'));
          const pin = pins.bashkitTerminal;
          const response = await fetch(`https://codeload.github.com/everruns/bashkit/tar.gz/${pin.revision}`);
          if (!response.ok) throw new Error(`Bashkit download failed ${response.status}`);
          const bytes = Buffer.from(await response.arrayBuffer());
          if (createHash('sha256').update(bytes).digest('hex') !== pin.archiveSha256) throw new Error('Bashkit archive checksum mismatch');
          const path = `${process.env.RUNNER_TEMP}/brush-web-bashkit.tar.gz`;
          await writeFile(path, bytes);
          await mkdir('.sources/bashkit', {recursive:true});
          execFileSync('tar', ['-xzf', path, '--strip-components=1', '-C', '.sources/bashkit']);
          JS
      - name: Record fixed Bash observations
        run: node scripts/bash-compat.mjs
        env:
          BASH_COMPAT_MODE: capture
          BASH_COMPAT_JOBS: 4
          BASH_COMPAT_SCRATCH: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        with:
          name: own-shell-oracle
          path: docs/evidence/own-shell-oracle.json
