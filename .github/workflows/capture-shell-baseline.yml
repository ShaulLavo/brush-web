name: Capture shell baseline
on:
  push:
    branches: [climb-scoreboard]
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: .build/shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell -> ../.build/shell
      - name: Pin the captured observations
        run: |
          node --input-type=module <<'JS'
          import {readFile, writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const path = 'sources.lock.json';
          const pins = JSON.parse(await readFile(path, 'utf8'));
          pins.shellScoreboard ??= {};
          pins.shellScoreboard.oracleSha256 = createHash('sha256').update(await readFile('docs/evidence/own-shell-oracle.json')).digest('hex');
          await writeFile(path, JSON.stringify(pins, null, 2) + '\n');
          JS
      - name: Record the first exact score
        run: node scripts/bash-compat.mjs
        env:
          BASH_COMPAT_MODE: frozen
          BASH_COMPAT_RECORD: '1'
          BASH_COMPAT_OUT: docs/evidence/own-shell-baseline.json
          BASH_COMPAT_SCRATCH: ${{ runner.temp }}
          BASH_COMPAT_JOBS: 4
      - uses: actions/upload-artifact@v4
        with:
          name: own-shell-baseline
          path: docs/evidence/own-shell-baseline.json
