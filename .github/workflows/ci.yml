name: Browser shell
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-wasip1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/brush-browser -> ../../.build/rust
            shell -> ../.build/shell
      - uses: actions/cache@v4
        with:
          path: |
            .build/bashkit
            .build/wasm-bindgen
          key: bashkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sources.lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run test:rust
        env:
          CARGO_TARGET_DIR: .build/rust
      - run: cargo fmt --manifest-path rust/brush-browser/Cargo.toml --check
      - run: cargo fmt --manifest-path shell/Cargo.toml --all --check
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: .build/shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-wasip1
          components: rustfmt
      - uses: bytecodealliance/actions/wasmtime/setup@v1.1.3
        with:
          version: v49.0.3
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell -> ../.build/shell
      - run: node scripts/check-shell-parser.mjs
      - run: cargo fmt --manifest-path shell/Cargo.toml --all --check
      - run: cargo test --locked --manifest-path shell/Cargo.toml --workspace -j2 --no-fail-fast
      - run: npm run test:shell:wasi
      - run: cargo build --locked --release --manifest-path shell/Cargo.toml -p shell-engine -j2
      - run: npm run fuzz:shell-words:ci -- --shell .build/shell/release/shell-engine
      - run: npm run fuzz:shell-arithmetic:ci -- --shell .build/shell/release/shell-engine
      - run: npm run fuzz:shell-readonly:ci -- --shell .build/shell/release/shell-engine
      - run: node scripts/fuzz-shell-parse-boundaries.mjs --shell .build/shell/release/shell-engine --replay scripts/fixtures/shell-parse-boundaries.json

  own-shell-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: .build/shell
      BASH_COMPAT_MODE: frozen
      BASH_COMPAT_ENGINES: own-shell
      BASH_COMPAT_JOBS: 4
      BASH_COMPAT_SKIP_BUILD: "1"
      BASH_COMPAT_RECORD: "0"
      BASH_COMPAT_BASE_REF: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell -> ../.build/shell
      - run: npm run test:shell:scoreboard
        env:
          BASH_COMPAT_SCRATCH: ${{ runner.temp }}
      - run: npm run build:shell
      - run: npm run compat:shell
        env:
          BASH_COMPAT_OUT: ${{ runner.temp }}/own-shell-current.json
          BASH_COMPAT_SCRATCH: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: own-shell-current
          path: ${{ runner.temp }}/own-shell-current.json
          if-no-files-found: ignore
